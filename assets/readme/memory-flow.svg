<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
  <title id="title">Memory flow across AI coding tools</title><desc id="desc">A diagram showing agents recording and retrieving local persistent memory.</desc>
  <defs><linearGradient id="g" x2="1"><stop stop-color="#4ecbff"/><stop offset="1" stop-color="#a67cff"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="1440" height="560" rx="28" fill="#07112c"/>
  <text x="72" y="78" fill="#9db2df" font-family="ui-monospace,monospace" font-size="17" font-weight="700" letter-spacing="3">THE CLAUDE-MEM CONTINUITY LOOP</text>
  <text x="72" y="124" fill="#f2f5ff" font-family="Georgia,serif" font-size="40">The next session starts informed.</text>
  <g fill="none" stroke="url(#g)" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 10" opacity=".75"><path d="M315 291H505"/><path d="M825 291H1015"/></g>
  <g font-family="Arial,sans-serif"><g transform="translate(72 210)"><rect width="243" height="164" rx="20" fill="#0d2144" stroke="#4ecbff" stroke-opacity=".65"/><text x="28" y="49" fill="#cbeeff" font-size="17" font-weight="700">1 · CAPTURE</text><text x="28" y="83" fill="#f5f7ff" font-size="25" font-weight="700">Your AI client</text><text x="28" y="112" fill="#9db2df" font-size="16">Claude Code · Codex</text><text x="28" y="136" fill="#9db2df" font-size="16">Cursor · Lovable · Replit</text></g><g transform="translate(505 176)"><rect width="320" height="236" rx="28" fill="#17143d" stroke="#a67cff" stroke-opacity=".75"/><circle cx="160" cy="78" r="35" fill="#9b7dff" filter="url(#glow)"/><text x="91" y="144" fill="#f5f2ff" font-size="26" font-weight="700">CLAUDE-MEM</text><text x="86" y="173" fill="#c8bfff" font-size="16">your local source of truth</text><text x="81" y="202" fill="#9db2df" font-size="15">decisions · outcomes · history</text></g><g transform="translate(1015 210)"><rect width="353" height="164" rx="20" fill="#102a43" stroke="#78dfb9" stroke-opacity=".65"/><text x="28" y="49" fill="#d5f8ea" font-size="17" font-weight="700">2 · UNDERSTAND</text><text x="28" y="83" fill="#f5f7ff" font-size="25" font-weight="700">The visual cockpit</text><text x="28" y="112" fill="#9db2df" font-size="16">graphs · signals · context</text><text x="28" y="136" fill="#9db2df" font-size="16">before changing your project</text></g></g>
  <text x="72" y="495" fill="#8da5d3" font-family="ui-monospace,monospace" font-size="15">YOUR MEMORY STAYS ON YOUR MACHINE. YOUR CONTEXT STAYS WITH YOUR WORK.</text>
</svg>
