<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="640" viewBox="0 0 1440 640" role="img" aria-labelledby="title desc">
  <title id="title">A short demo of persistent memory across coding sessions</title><desc id="desc">A stylized terminal conversation showing a decision recorded in one session and retrieved in another.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0a1538"/><stop offset="1" stop-color="#160c35"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="1440" height="640" rx="28" fill="url(#bg)"/>
  <rect x="72" y="72" width="1296" height="496" rx="19" fill="#060c22" stroke="#5e78ba" stroke-opacity=".5"/>
  <circle cx="108" cy="108" r="8" fill="#ff6d79"/><circle cx="136" cy="108" r="8" fill="#ffc369"/><circle cx="164" cy="108" r="8" fill="#76e5b5"/>
  <text x="204" y="114" fill="#92a8d1" font-family="ui-monospace,monospace" font-size="16">persistent-memory / local session</text>
  <text x="110" y="178" fill="#4ecbff" font-family="ui-monospace,monospace" font-size="19">claude-code  ›  record_memory</text>
  <text x="110" y="218" fill="#edf4ff" font-family="ui-monospace,monospace" font-size="19">"Keep the auth boundary local-first; no project context leaves this machine."</text>
  <rect x="108" y="252" width="500" height="76" rx="12" fill="#102a43" stroke="#4ecbff" stroke-opacity=".42"/>
  <text x="132" y="282" fill="#cfeeff" font-family="ui-monospace,monospace" font-size="16">✓ durable decision recorded</text><text x="132" y="310" fill="#91add9" font-family="ui-monospace,monospace" font-size="15">stored locally · searchable by meaning</text>
  <path d="M690 214V384" stroke="#a67cff" stroke-width="3" stroke-dasharray="7 10" filter="url(#glow)"/><path d="M672 366L690 391L708 366" fill="none" stroke="#a67cff" stroke-width="3"/>
  <text x="732" y="400" fill="#a67cff" font-family="ui-monospace,monospace" font-size="17">NEXT SESSION · ANOTHER CLIENT</text>
  <text x="110" y="438" fill="#9a7aff" font-family="ui-monospace,monospace" font-size="19">codex  ›  semantic_search_memory "how should auth work?"</text>
  <rect x="108" y="466" width="990" height="60" rx="12" fill="#181542" stroke="#9a7aff" stroke-opacity=".44"/>
  <text x="132" y="503" fill="#f1edff" font-family="ui-monospace,monospace" font-size="17">Found: local-first auth boundary · rationale preserved · 0 external requests</text>
  <text x="1142" y="500" fill="#76e5b5" font-family="ui-monospace,monospace" font-size="18" font-weight="700">CONTINUE →</text>
</svg>
